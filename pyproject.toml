[project]
name = "company-brain"
version = "0.1.0"
description = "Local-first Company Brain: Fabric IQ + Work IQ + Foundry IQ → unified memory engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Roey Zalta" }]
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3.6",
    "openai>=1.50",
    "msal>=1.31",
    "azure-identity>=1.19",
    "requests>=2.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "click>=8.1",
    "rich>=13.9",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
company-brain = "company_brain.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core/company_brain", "connectors", "apps"]

[tool.uv.sources]

[tool.ruff]
line-length = 100
target-version = "py311"
